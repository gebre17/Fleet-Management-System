name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        # Installs from the fully-pinned lockfile for reproducible CI runs;
        # requirements.txt stays the human-edited source of direct deps
        # (see backend/requirements.lock's header for how to regenerate it).
        run: pip install -r requirements.lock
      - name: Lint (ruff)
        run: ruff check app
      - name: Format check (black)
        run: black --check app
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=60
      - name: Dependency audit
        # Fails on any *new* CVE. The IDs below are known, already-triaged
        # findings in transitive deps we can't cleanly patch yet:
        #   - starlette (PYSEC-2026-{161,248,249,1943,1941,2281,2280}): needs
        #     a coordinated FastAPI major-version bump, tracked separately.
        #   - ecdsa (PYSEC-2026-1325) / pyasn1 (PYSEC-2026-{2263,3455,3456,3457}):
        #     pulled in transitively by python-jose for RSA/ECDSA JWT algorithms
        #     this app doesn't use (only HS256 is used); `rsa` pins
        #     pyasn1<0.5.0, so bumping pyasn1 directly has no effect without
        #     first dropping unused-algorithm support from python-jose.
        #   - pytest (PYSEC-2026-1845) / black (PYSEC-2026-{2120,2121}): dev-only
        #     tooling, never reachable from the running application.
        # Re-run without --ignore-vuln after each dependency bump to confirm
        # which of these can be removed from this list.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --skip-editable \
            --ignore-vuln PYSEC-2026-1845 \
            --ignore-vuln PYSEC-2026-2121 \
            --ignore-vuln PYSEC-2026-2120 \
            --ignore-vuln PYSEC-2026-2263 \
            --ignore-vuln PYSEC-2026-3455 \
            --ignore-vuln PYSEC-2026-3456 \
            --ignore-vuln PYSEC-2026-3457 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1943 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-1325

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Unit tests with coverage
        run: npm test -- --ci --coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000
          NEXT_PUBLIC_MAP_TILE_URL: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
