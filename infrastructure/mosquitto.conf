allow_anonymous true
allow_zero_length_clientid true

# Mosquitto 2.x starts in "local only mode" (loopback-only, refuses other
# containers) unless a listener is declared explicitly.
listener 1883
protocol mqtt

listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true
