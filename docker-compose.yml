services:
  postgres:
    image: postgres:15
    container_name: trackfleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trackfleet
      POSTGRES_USER: trackfleet
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trackfleet_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackfleet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trackfleet

  redis:
    image: redis:7-alpine
    container_name: trackfleet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trackfleet

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: trackfleet-mosquitto
    restart: unless-stopped
    volumes:
      - ./infrastructure/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - trackfleet

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trackfleet-backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://trackfleet:${DB_PASSWORD:-trackfleet_dev_password}@postgres:5432/trackfleet
      - REDIS_URL=redis://redis:6379
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - trackfleet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
        NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png}
    container_name: trackfleet-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - trackfleet

  nginx:
    image: nginx:alpine
    container_name: trackfleet-nginx
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - trackfleet

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_logs:

networks:
  trackfleet:
    driver: bridge
